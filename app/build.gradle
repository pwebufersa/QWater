apply plugin: 'com.android.application'

// Chave de assinatura do APK de release, montada pelo fluxo do GitHub Actions.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Permite que o fluxo de trabalho informe a versão sem editar o arquivo.
def versionNameOverride = project.findProperty('qwater.versionName')
def versionCodeOverride = project.findProperty('qwater.versionCode')

android {
    compileSdkVersion 34 // Atualizado para Android 14
    buildToolsVersion '34.0.0'

    namespace 'br.com.ufersa.qwater'

    defaultConfig {
        applicationId "br.com.ufersa.qwater"
        minSdkVersion 21
        targetSdkVersion 34 // Atualizado para Android 14
        versionCode versionCodeOverride ? versionCodeOverride.toInteger() : 23
        versionName versionNameOverride ?: "1.2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProperties.getProperty('storeFile', 'qwater.keystore'))
            storePassword keystoreProperties.getProperty('storePassword', '')
            keyAlias keystoreProperties.getProperty('keyAlias', 'qwater')
            keyPassword keystoreProperties.getProperty('keyPassword', '')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sem a chave de release, o APK de release é assinado com a chave de depuração,
            // para continuar instalável em teste manual.
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
    buildFeatures {
        buildConfig true
    }

    lint {
        checkReleaseBuilds false
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.test.ext:junit:1.2.1'
    testImplementation 'junit:junit:4.13.2'
    implementation files('libs/GraphView-4.2.1.jar')

    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // Location Play Services
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Dexter for runtime permissions
    implementation 'com.karumi:dexter:6.2.2'
}
