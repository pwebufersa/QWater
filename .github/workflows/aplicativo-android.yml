name: Aplicativo Android

run-name: Aplicativo Android · ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: apk-master
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/aplicativo-android.yml"

jobs:
  apk:
    name: Gerar APK
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Componentes do SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Gerar o APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Registrar versão e hash
        id: entrega
        run: |
          VERSAO=$(sed -n 's/.*versionName[[:space:]]*"\(.*\)".*/\1/p' app/build.gradle)
          CODIGO=$(sed -n 's/.*versionCode[[:space:]]*\([0-9]*\).*/\1/p' app/build.gradle)
          APK=app/build/outputs/apk/debug/app-debug.apk
          ENTREGA=build/entrega

          mkdir -p "$ENTREGA"
          cp "$APK" "$ENTREGA/QWater-$VERSAO.apk"
          ( cd "$ENTREGA" && sha256sum "QWater-$VERSAO.apk" > SHA256.txt )

          HASH=$(cut -d' ' -f1 "$ENTREGA/SHA256.txt")
          {
            echo "aplicativo: QWater-$VERSAO.apk"
            echo "versao: $VERSAO"
            echo "versionCode: $CODIGO"
            echo "commit: $GITHUB_SHA"
            echo "execucao: $GITHUB_RUN_NUMBER"
            echo "testes: fluxo Testes automaticos"
            echo "sha256: $HASH"
          } > "$ENTREGA/INFO.txt"

          cat "$ENTREGA/INFO.txt"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: qwater-apk
          path: |
            build/entrega/*.apk
            build/entrega/SHA256.txt
            build/entrega/INFO.txt
          retention-days: 30

      - name: Publicar o APK na pasta dist
        if: github.ref == 'refs/heads/master'
        env:
          VERSAO: ${{ steps.entrega.outputs.versao }}
          CODIGO: ${{ steps.entrega.outputs.codigo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Duas execuções da mesma entrega podem disputar o push; cada tentativa
          # refaz o commit sobre o topo atual da branch, em vez de fazer rebase.
          for tentativa in 1 2 3 4 5; do
            git fetch --quiet origin master
            git reset --soft origin/master
            cp "build/entrega/QWater-$VERSAO.apk" dist/app-debug.apk
            git add dist/app-debug.apk
            if git diff --cached --quiet; then
              echo "APK já publicado; nada a publicar."
              exit 0
            fi
            git commit -m "Publica o APK $VERSAO (versionCode $CODIGO) [skip ci]"
            if git push origin master; then
              exit 0
            fi
            sleep 5
          done
          echo "Falha ao publicar o APK no repositório." >&2
          exit 1
