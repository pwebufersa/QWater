name: Aplicativo Android

run-name: Aplicativo Android · ${{ github.ref_name }}

permissions:
  contents: write

concurrency:
  group: apk-master
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "versionName do APK"
        required: false
        default: "1.2.0"
      version_code:
        description: "versionCode (inteiro, maior que o anterior)"
        required: false
        default: "23"
  push:
    branches: [master]
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/aplicativo-android.yml"

jobs:
  apk:
    name: Gerar APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      VERSAO: ${{ inputs.versao || '1.2.0' }}
      CODIGO: ${{ inputs.version_code || '23' }}
    steps:
      - uses: actions/checkout@v7

      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Componentes do SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Preparar a chave de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > qwater.keystore
            printf '%s\n' "$KEYSTORE_PROPERTIES" > keystore.properties
            echo "Chave de assinatura obtida dos segredos do repositório."
            exit 0
          fi

          # Sem segredo, uma chave nova é gerada; o APK não atualiza instalações
          # feitas com outra chave.
          SENHA=$(openssl rand -hex 16)
          keytool -genkeypair \
            -keystore qwater.keystore \
            -alias qwater \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$SENHA" \
            -keypass "$SENHA" \
            -dname "CN=QWater, OU=UFERSA, O=QWater, L=Mossoro, ST=RN, C=BR" > /dev/null
          {
            echo "storeFile=qwater.keystore"
            echo "storePassword=$SENHA"
            echo "keyAlias=qwater"
            echo "keyPassword=$SENHA"
          } > keystore.properties
          echo "Sem segredo de chave: uma chave nova foi gerada e o APK não atualiza instalações anteriores."

      - name: Gerar o APK de release
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pqwater.versionName="$VERSAO" \
            -Pqwater.versionCode="$CODIGO" \
            --no-daemon

      - name: Registrar versão e hash
        id: entrega
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ENTREGA=build/entrega

          mkdir -p "$ENTREGA"
          cp "$APK" "$ENTREGA/QWater-$VERSAO.apk"
          ( cd "$ENTREGA" && sha256sum "QWater-$VERSAO.apk" > SHA256.txt )

          HASH=$(cut -d' ' -f1 "$ENTREGA/SHA256.txt")
          {
            echo "aplicativo: QWater-$VERSAO.apk"
            echo "versao: $VERSAO"
            echo "versionCode: $CODIGO"
            echo "tipo: release"
            echo "commit: $GITHUB_SHA"
            echo "execucao: $GITHUB_RUN_NUMBER"
            echo "testes: fluxo Testes automaticos"
            echo "sha256: $HASH"
          } > "$ENTREGA/INFO.txt"

          cat "$ENTREGA/INFO.txt"
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          echo "codigo=$CODIGO" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: qwater-apk
          path: |
            build/entrega/*.apk
            build/entrega/SHA256.txt
            build/entrega/INFO.txt
          retention-days: 30

      - name: Publicar o APK na pasta dist
        if: github.ref == 'refs/heads/master'
        env:
          VERSAO: ${{ steps.entrega.outputs.versao }}
          CODIGO: ${{ steps.entrega.outputs.codigo }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Duas execuções da mesma entrega podem disputar o push; cada tentativa
          # refaz o commit sobre o topo atual da branch, em vez de fazer rebase.
          for tentativa in 1 2 3 4 5; do
            git fetch --quiet origin master
            git reset --soft origin/master
            cp "build/entrega/QWater-$VERSAO.apk" dist/QWater.apk
            git add dist/QWater.apk
            if git diff --cached --quiet; then
              echo "APK já publicado; nada a publicar."
              exit 0
            fi
            git commit -m "Publica o APK $VERSAO (versionCode $CODIGO) [skip ci]"
            if git push origin master; then
              exit 0
            fi
            sleep 5
          done
          echo "Falha ao publicar o APK no repositório." >&2
          exit 1
